<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="devBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#devBg)"/>

  <!-- Phone laying down with internal tools -->
  <rect x="130" y="45" width="140" height="210" rx="22" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
  <rect x="140" y="55" width="120" height="190" rx="14" fill="#1E293B"/>

  <!-- Charging port at bottom -->
  <rect x="180" y="240" width="40" height="8" rx="4" fill="#38BDF8"/>

  <!-- Screwdriver precision tool -->
  <path d="M270 50L290 70L240 120L220 100Z" fill="#6366F1"/>
  <path d="M220 100L205 115L200 125L210 130L220 125L235 110" fill="#94A3B8"/>
  <rect x="280" y="40" width="30" height="15" rx="4" transform="rotate(45 280 40)" fill="#4338CA"/>

  <!-- Quality Check Shield Badge -->
  <g transform="translate(50, 160)">
    <rect width="115" height="42" rx="21" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(99,102,241,0.18))"/>
    <circle cx="21" cy="21" r="13" fill="#6366F1"/>
    <path d="M17 21L20 24L26 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0F172A">REPARO OK</text>
  </g>
</svg>