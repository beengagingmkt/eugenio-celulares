<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="batBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="batGrad" x1="120" y1="80" x2="280" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#batBg)"/>

  <!-- Battery Outer Shell -->
  <rect x="130" y="80" width="140" height="150" rx="16" fill="#1E293B" stroke="#334155" stroke-width="4"/>
  <!-- Battery Anode Terminal -->
  <rect x="175" y="65" width="50" height="16" rx="4" fill="#64748B"/>
  
  <!-- Battery Cells Indicator -->
  <rect x="142" y="180" width="116" height="38" rx="8" fill="url(#batGrad)"/>
  <rect x="142" y="136" width="116" height="38" rx="8" fill="url(#batGrad)"/>
  <rect x="142" y="92" width="116" height="38" rx="8" fill="url(#batGrad)"/>

  <!-- Thunderbolt Charge Icon -->
  <path d="M204 110L186 160H208L196 200L222 150H200L204 110Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" stroke-linejoin="round"/>

  <!-- Health Badge 100% -->
  <g transform="translate(250, 160)">
    <rect width="110" height="42" rx="21" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(22,163,74,0.18))"/>
    <circle cx="21" cy="21" r="13" fill="#22C55E"/>
    <path d="M17 21L20 24L26 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#0F172A">100%</text>
  </g>
</svg>