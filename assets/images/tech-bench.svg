<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgLab" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="matGrad" x1="50" y1="260" x2="550" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bgLab)"/>
  
  <!-- Back Wall Shelving / Tech Glow -->
  <line x1="40" y1="120" x2="560" y2="120" stroke="#334155" stroke-width="2"/>
  <circle cx="100" cy="80" r="18" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
  <circle cx="150" cy="80" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <rect x="220" y="65" width="80" height="40" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <rect x="230" y="75" width="25" height="15" rx="3" fill="#22C55E"/>
  <text x="260" y="87" font-family="monospace" font-size="10" fill="#22C55E">5.0V</text>

  <!-- Anti-static repair mat -->
  <rect x="40" y="240" width="520" height="140" rx="14" fill="url(#matGrad)" stroke="#38BDF8" stroke-width="2" opacity="0.9"/>
  <!-- Mat grid lines -->
  <line x1="40" y1="280" x2="560" y2="280" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="320" x2="560" y2="320" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="360" x2="560" y2="360" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>

  <!-- Microscope / Magnifier arm -->
  <g transform="translate(120, 110)">
    <rect x="45" y="0" width="12" height="150" rx="6" fill="#64748B"/>
    <path d="M20 30L80 30" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="80" cy="50" r="24" fill="#334155" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="80" cy="50" r="14" fill="#38BDF8" opacity="0.8"/>
    <path d="M75 74L75 110" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="75" cy="115" rx="16" ry="6" fill="#E2E8F0"/>
  </g>

  <!-- Open Smartphone undergoing precision repair -->
  <g transform="translate(260, 260)">
    <!-- Chassis -->
    <rect x="0" y="0" width="130" height="90" rx="12" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
    <!-- Internal battery pack -->
    <rect x="10" y="10" width="50" height="70" rx="4" fill="#334155"/>
    <text x="18" y="48" font-family="sans-serif" font-size="8" fill="#94A3B8">Li-ion</text>
    <!-- Logic board -->
    <rect x="68" y="10" width="50" height="40" rx="4" fill="#0284C7"/>
    <rect x="80" y="20" width="20" height="20" rx="2" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <!-- Precision tools around -->
    <line x1="140" y1="10" x2="180" y2="80" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
    <line x1="-30" y1="20" x2="-10" y2="75" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Badge "Bancada Técnica Especializada" -->
  <g transform="translate(380, 50)">
    <rect width="180" height="46" rx="23" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))"/>
    <circle cx="25" cy="23" r="10" fill="#22C55E"/>
    <text x="44" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Bancada Especializada</text>
  </g>
</svg>