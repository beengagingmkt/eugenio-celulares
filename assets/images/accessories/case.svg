<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="caseBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="140" y1="40" x2="260" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#caseBg)"/>
  <!-- Protective Case Shape -->
  <rect x="135" y="40" width="130" height="220" rx="26" fill="url(#cGrad)" stroke="#1E40AF" stroke-width="4"/>
  <!-- Camera cutout -->
  <rect x="145" y="52" width="46" height="52" rx="12" fill="#0F172A"/>
  <circle cx="158" cy="65" r="7" fill="#334155"/>
  <circle cx="178" cy="65" r="7" fill="#334155"/>
  <circle cx="168" cy="88" r="7" fill="#334155"/>
  <!-- MagSafe ring indicator -->
  <circle cx="200" cy="155" r="32" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="200" y1="187" x2="200" y2="205" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Badge -->
  <g transform="translate(240, 190)">
    <rect width="110" height="34" rx="17" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.1))"/>
    <text x="18" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0131CD">Anti-Impacto</text>
  </g>
</svg>