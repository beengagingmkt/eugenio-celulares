<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="cblBg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#cblBg)"/>
  <!-- Braided Cable Curve -->
  <path d="M90 220 C 130 80, 260 80, 310 210" stroke="#7C3AED" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M90 220 C 130 80, 260 80, 310 210" stroke="#DDD6FE" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="4 4"/>
  <!-- Type-C / Lightning Connector Heads -->
  <rect x="75" y="200" width="30" height="55" rx="8" fill="#1E293B"/>
  <rect x="83" y="255" width="14" height="20" rx="3" fill="#CBD5E1"/>
  
  <rect x="295" y="190" width="30" height="55" rx="8" fill="#1E293B"/>
  <rect x="303" y="245" width="14" height="20" rx="3" fill="#CBD5E1"/>

  <g transform="translate(130, 220)">
    <rect width="140" height="34" rx="17" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.1))"/>
    <text x="18" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#7C3AED">Nylon Reforçado</text>
  </g>
</svg>